name: SZB 2020 Media Wayback Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_szb_2020_img_cdx.py'
      - '.github/workflows/szb-2020-img-cdx.yml'

permissions:
  contents: write

concurrency:
  group: szb-2020-img-cdx
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query archived 2020 media inventory
        run: python scripts/recover_szb_2020_img_cdx.py
      - name: Commit media inventory metadata
        run: |
          if [ -z "$(git status --porcelain -- data/szb_2020_img_cdx)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/szb_2020_img_cdx
          git commit -m 'data: inventory archived 2020 szb media'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Sina Issue Inline Media Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_sina_inline_media.py'
      - '.github/workflows/sina-inline-media.yml'

permissions:
  contents: write

concurrency:
  group: sina-inline-media
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Recover raw-source Sina media from issue posts
        run: python scripts/recover_sina_inline_media.py
      - name: Commit recovered media metadata
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sina_inline_media.csv data/repost_fullpage/sina_inline_media_report.json)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sina_inline_media.csv data/repost_fullpage/sina_inline_media_report.json
          git commit -m 'data: recover Sina issue inline media'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

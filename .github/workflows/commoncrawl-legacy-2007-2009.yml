name: Recover Legacy 2007-2009 via Common Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/commoncrawl_legacy_2007_2009.py'
      - '.github/workflows/commoncrawl-legacy-2007-2009.yml'

permissions:
  contents: write

concurrency:
  group: commoncrawl-legacy-2007-2009
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 warcio
      - name: Query historical Common Crawl and recover WARC records
        run: python scripts/commoncrawl_legacy_2007_2009.py
      - name: Commit recovery metadata
        run: |
          if [ -z "$(git status --porcelain -- data/legacy_2007_2009_commoncrawl)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy_2007_2009_commoncrawl
          git commit -m 'data: recover 2007-2009 qlsn pages from Common Crawl'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

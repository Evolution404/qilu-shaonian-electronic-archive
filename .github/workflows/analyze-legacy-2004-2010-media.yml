name: Analyze Legacy 2004-2010 Media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_legacy_2004_2010_archived_media.py'
      - '.github/workflows/analyze-legacy-2004-2010-media.yml'

permissions:
  contents: write

concurrency:
  group: analyze-legacy-2004-2010-media
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim
      - name: Inspect archived legacy media
        run: python scripts/analyze_legacy_2004_2010_archived_media.py
      - name: Commit metadata
        run: |
          if [ -z "$(git status --porcelain -- data/legacy_2004_2010_media_analysis)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy_2004_2010_media_analysis
          git commit -m 'data: inspect archived 2004-2010 media'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

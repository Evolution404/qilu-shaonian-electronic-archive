name: SZB Full-page Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/recover_szb_fullpages.py'
      - '.github/workflows/szb-fullpage-recovery.yml'

permissions:
  contents: write

concurrency:
  group: szb-fullpage-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover historical digital-paper assets
        run: python scripts/recover_szb_fullpages.py
      - name: Commit recovery metadata
        run: |
          if [ -z "$(git status --porcelain -- data/szb_recovery)" ]; then
            echo 'No SZB recovery changes.'
            exit 0
          fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/szb_recovery
          git commit -m 'data: refresh szb page-asset recovery'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

name: Promote 2012 Winter Combined Cover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/promote_sina_2012_winter_cover.py'
      - 'data/repost_fullpage/sina_2012_winter_combined/visual_verification.json'
      - '.github/workflows/promote-sina-2012-winter-cover.yml'

permissions:
  contents: write

concurrency:
  group: promote-sina-2012-winter-cover
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote verified cover record
        run: python scripts/promote_sina_2012_winter_cover.py
      - name: Commit promoted record
        run: |
          if [ -z "$(git status --porcelain -- data/electronic_records.csv)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/electronic_records.csv
          git commit -m 'data: promote 2012 winter combined cover'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: 2026 Sohu Frontpage Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_2026_sohu_frontpage.py'
      - '.github/workflows/recover-2026-sohu-frontpage.yml'

permissions:
  contents: write

concurrency:
  group: recover-2026-sohu-frontpage
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Recover exact Sohu repost and media metadata
        run: python scripts/recover_2026_sohu_frontpage.py
      - name: Commit recovery metadata
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sohu_2026_zhenhua)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sohu_2026_zhenhua
          git commit -m 'data: recover 2026 Sohu front-page repost metadata'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Analyze 2004-2005 Wayback Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_2004_2005_wayback_assets.py'
      - '.github/workflows/analyze-2004-2005-wayback-assets.yml'

permissions:
  contents: write

concurrency:
  group: analyze-2004-2005-wayback-assets
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim
      - name: Inspect all archived 2004-2005 images
        run: python scripts/analyze_2004_2005_wayback_assets.py
      - name: Commit asset metadata
        run: |
          if [ -z "$(git status --porcelain -- data/legacy_2004_2005_assets)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy_2004_2005_assets
          git commit -m 'data: inspect 2004-2005 archived qlsn assets'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

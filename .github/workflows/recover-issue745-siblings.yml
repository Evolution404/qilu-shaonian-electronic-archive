name: QLSN Issue 745 Sibling Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_issue745_siblings.py'
      - '.github/workflows/recover-issue745-siblings.yml'

permissions:
  contents: write

concurrency:
  group: qlsn-issue745-siblings
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover article siblings
        run: python scripts/recover_issue745_siblings.py
      - name: Commit recovery metadata
        run: |
          if [ -z "$(git status --porcelain -- data/legacy_recovery/issue745_siblings)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy_recovery/issue745_siblings
          git commit -m 'data: recover issue 745 sibling articles'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

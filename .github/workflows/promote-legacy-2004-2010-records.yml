name: Promote Legacy 2004-2010 Records

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/promote_legacy_2004_2010_records.py'
      - '.github/workflows/promote-legacy-2004-2010-records.yml'

permissions:
  contents: write

concurrency:
  group: promote-legacy-2004-2010-records
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote canonical records
        run: python scripts/promote_legacy_2004_2010_records.py
      - name: Commit canonical data
        run: |
          if [ -z "$(git status --porcelain -- data/electronic_records.csv data/year_coverage.csv)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/electronic_records.csv data/year_coverage.csv
          git commit -m 'data: promote verified 2006-2009 legacy records'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

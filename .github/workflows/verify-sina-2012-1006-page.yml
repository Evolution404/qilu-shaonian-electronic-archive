name: Verify Sina 2012 Issue 1006 Page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_sina_2012_1006_page.py'
      - '.github/workflows/verify-sina-2012-1006-page.yml'

permissions:
  contents: write

concurrency:
  group: verify-sina-2012-1006-page
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - name: Deep verify recovered 2012 page candidate
        run: python scripts/verify_sina_2012_1006_page.py
      - name: Export transient candidate preview
        run: |
          mkdir -p /tmp/qilu-preview
          python - <<'PY'
          import urllib.request
          url='https://s12.sinaimg.cn/large/4c4fc7d9hb626902713eb&690'
          ref='https://blog.sina.com.cn/s/blog_4c4fc7d901011cp9.html'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':ref,'Accept':'image/*,*/*'})
          with urllib.request.urlopen(req,timeout=30) as r, open('/tmp/qilu-preview/2012-01-03-candidate.jpg','wb') as f:
              f.write(r.read(20*1024*1024))
          PY
      - name: Upload transient visual-QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qilu-2012-01-03-page-preview
          path: /tmp/qilu-preview/2012-01-03-candidate.jpg
          retention-days: 1
          if-no-files-found: error
      - name: Commit verification evidence
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sina_2012_1006)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sina_2012_1006
          git commit -m 'data: verify 2012 issue 1006 page candidate'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

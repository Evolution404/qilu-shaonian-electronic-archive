name: Retry Legacy 2004-2010 Capture Errors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/retry_legacy_2004_2010_errors.py'
      - '.github/workflows/retry-legacy-2004-2010-errors.yml'

permissions:
  contents: write

concurrency:
  group: retry-legacy-2004-2010-errors
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retry transient archive failures
        run: python scripts/retry_legacy_2004_2010_errors.py
      - name: Commit retry metadata
        run: |
          if [ -z "$(git status --porcelain -- data/legacy_2004_2010_retry)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy_2004_2010_retry
          git commit -m 'data: retry failed 2004-2010 legacy captures'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

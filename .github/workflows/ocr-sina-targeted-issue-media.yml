name: OCR Targeted Sina Issue Media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ocr_sina_targeted_issue_media.py'
      - '.github/workflows/ocr-sina-targeted-issue-media.yml'

permissions:
  contents: write

concurrency:
  group: ocr-sina-targeted-issue-media
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - name: Verify targeted recovered Sina media
        run: python scripts/ocr_sina_targeted_issue_media.py
      - name: Commit targeted OCR evidence
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sina_targeted_ocr.csv data/repost_fullpage/sina_targeted_ocr_report.json)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sina_targeted_ocr.csv data/repost_fullpage/sina_targeted_ocr_report.json
          git commit -m 'data: verify targeted Sina issue media'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

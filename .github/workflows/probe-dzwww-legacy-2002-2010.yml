name: Probe Dazhongwang Qilu Shaonian 2002-2010

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_dzwww_legacy_2002_2010.py'
      - '.github/workflows/probe-dzwww-legacy-2002-2010.yml'

permissions:
  contents: write

concurrency:
  group: probe-dzwww-legacy-2002-2010
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Enumerate archived four-page electronic-edition paths
        run: python scripts/probe_dzwww_legacy_2002_2010.py
      - name: Commit probe metadata
        run: |
          if [ -z "$(git status --porcelain -- data/dzwww_2002_2010_probe)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dzwww_2002_2010_probe
          git commit -m 'data: probe dzwww qilu shaonian 2002-2010 paths'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Recover SZB AJAX Endpoints

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_szb_ajax_endpoints.py'
      - '.github/workflows/recover-szb-ajax-endpoints.yml'

permissions:
  contents: write

concurrency:
  group: recover-szb-ajax-endpoints
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover deployed AJAX/data contracts
        run: python scripts/recover_szb_ajax_endpoints.py
      - name: Commit recovery evidence
        run: |
          if [ -z "$(git status --porcelain -- data/szb_ajax_recovery)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/szb_ajax_recovery
          git commit -m 'data: record deployed szb AJAX recovery'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

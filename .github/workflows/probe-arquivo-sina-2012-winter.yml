name: Probe Arquivo.pt Sina 2012 Winter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_arquivo_sina_2012_winter.py'
      - '.github/workflows/probe-arquivo-sina-2012-winter.yml'

permissions:
  contents: write

concurrency:
  group: probe-arquivo-sina-2012-winter
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Probe Arquivo.pt history and text index
        run: python scripts/probe_arquivo_sina_2012_winter.py
      - name: Commit archive evidence
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sina_2012_winter_combined/arquivo_pt)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sina_2012_winter_combined/arquivo_pt
          git commit -m 'data: record Arquivo.pt winter recovery'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

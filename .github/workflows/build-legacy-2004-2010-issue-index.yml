name: Build Legacy 2004-2010 Issue Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_legacy_2004_2010_issue_index.py'
      - '.github/workflows/build-legacy-2004-2010-issue-index.yml'

permissions:
  contents: write

concurrency:
  group: build-legacy-2004-2010-issue-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build normalized issue evidence index
        run: python scripts/build_legacy_2004_2010_issue_index.py
      - name: Commit issue index
        run: |
          if [ -z "$(git status --porcelain -- data/legacy_2004_2010_issue_index.csv data/legacy_2004_2010_issue_index_report.json)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy_2004_2010_issue_index.csv data/legacy_2004_2010_issue_index_report.json
          git commit -m 'data: index 2004-2010 issue evidence'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

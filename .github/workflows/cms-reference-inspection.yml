name: CMS Reference Inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_53bk_reference.py'
      - 'scripts/extract_53bk_focused.py'
      - 'scripts/extract_53bk_asset_logic.py'
      - 'scripts/extract_53bk_upload_naming.py'
      - 'scripts/extract_53bk_makephoto_logic.py'
      - '.github/workflows/cms-reference-inspection.yml'

permissions:
  contents: write

concurrency:
  group: cms-reference-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public reference package paths
        run: python scripts/inspect_53bk_reference.py
      - name: Emit focused recovery summary
        run: python scripts/extract_53bk_focused.py
      - name: Extract page image and PDF field semantics
        run: python scripts/extract_53bk_asset_logic.py
      - name: Extract backend upload naming rules
        run: python scripts/extract_53bk_upload_naming.py
      - name: Extract PDF-to-image generation naming
        run: python scripts/extract_53bk_makephoto_logic.py
      - name: Commit reference metadata
        run: |
          if [ -z "$(git status --porcelain -- data/cms_reference)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cms_reference
          git commit -m 'data: inspect 53BK reference path conventions'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

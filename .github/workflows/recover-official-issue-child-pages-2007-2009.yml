name: Recover Official 2007-2009 Issue Child Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_official_issue_child_pages_2007_2009.py'
      - '.github/workflows/recover-official-issue-child-pages-2007-2009.yml'

permissions:
  contents: write

concurrency:
  group: recover-official-issue-child-pages-2007-2009
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover official issue child pages
        run: python scripts/recover_official_issue_child_pages_2007_2009.py
      - name: Commit recovery metadata
        run: |
          if [ -z "$(git status --porcelain -- data/legacy_2007_2009_child_recovery)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legacy_2007_2009_child_recovery
          git commit -m 'data: recover official 2007-2009 issue child pages'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: 2024 Kongfz Key Image Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_kongfz_2024_key_images.py'
      - '.github/workflows/analyze-kongfz-2024-key-images.yml'

permissions:
  contents: write

concurrency:
  group: analyze-kongfz-2024-key-images
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and Chinese OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim
      - name: Resolve listing gallery and OCR issue metadata
        run: python scripts/analyze_kongfz_2024_key_images.py
      - name: Commit derived metadata
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/kongfz_2024_bound_volume)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/kongfz_2024_bound_volume
          git commit -m 'data: resolve 2024 bound-volume issue metadata'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Recover qlsn Electronic Edition Threads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_sdbook_eedition_threads.py'
      - '.github/workflows/recover-sdbook-eedition-threads.yml'

permissions:
  contents: write

concurrency:
  group: recover-sdbook-eedition-threads
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Recover access/download/sample-paper discussions
        run: python scripts/recover_sdbook_eedition_threads.py
      - name: Commit discussion evidence
        run: |
          if [ -z "$(git status --porcelain -- data/sdbook_eedition_threads)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sdbook_eedition_threads
          git commit -m 'data: recover qlsn electronic-edition forum threads'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

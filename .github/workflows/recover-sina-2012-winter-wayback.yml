name: Recover Sina 2012 Winter Media from Wayback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_sina_2012_winter_wayback.py'
      - '.github/workflows/recover-sina-2012-winter-wayback.yml'

permissions:
  contents: write

concurrency:
  group: recover-sina-2012-winter-wayback
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Recover historical blog media references
        run: python scripts/recover_sina_2012_winter_wayback.py
      - name: Commit Wayback recovery evidence
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sina_2012_winter_combined/wayback)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sina_2012_winter_combined/wayback
          git commit -m 'data: recover 2012 winter media from Wayback'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

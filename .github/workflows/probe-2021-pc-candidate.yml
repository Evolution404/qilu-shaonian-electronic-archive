name: 2021 Exact PC Page Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_2021_pc_candidate.py'
      - '.github/workflows/probe-2021-pc-candidate.yml'

permissions:
  contents: write

concurrency:
  group: probe-2021-pc-candidate
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe deterministic PC sibling
        run: python scripts/probe_2021_pc_candidate.py
      - name: Commit probe metadata
        run: |
          if [ -z "$(git status --porcelain -- data/szb_2021_pc_probe)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/szb_2021_pc_probe
          git commit -m 'data: verify exact 2021 PC page candidate'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

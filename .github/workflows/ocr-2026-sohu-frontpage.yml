name: 2026 Sohu Frontpage OCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ocr_2026_sohu_frontpage_images.py'
      - '.github/workflows/ocr-2026-sohu-frontpage.yml'

permissions:
  contents: write

concurrency:
  group: ocr-2026-sohu-frontpage
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chinese OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim
      - name: OCR candidate images
        run: python scripts/ocr_2026_sohu_frontpage_images.py
      - name: Commit OCR metadata
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sohu_2026_zhenhua)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sohu_2026_zhenhua
          git commit -m 'data: OCR 2026 Sohu front-page repost images'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

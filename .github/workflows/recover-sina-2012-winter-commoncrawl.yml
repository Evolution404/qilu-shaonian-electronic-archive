name: Recover Sina 2012 Winter from Common Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_sina_2012_winter_commoncrawl.py'
      - '.github/workflows/recover-sina-2012-winter-commoncrawl.yml'

permissions:
  contents: write

concurrency:
  group: recover-sina-2012-winter-commoncrawl
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Recover exact historical Sina posts
        run: python scripts/recover_sina_2012_winter_commoncrawl.py
      - name: Commit Common Crawl recovery evidence
        run: |
          if [ -z "$(git status --porcelain -- data/repost_fullpage/sina_2012_winter_combined/commoncrawl)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/repost_fullpage/sina_2012_winter_combined/commoncrawl
          git commit -m 'data: recover 2012 winter posts from Common Crawl'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

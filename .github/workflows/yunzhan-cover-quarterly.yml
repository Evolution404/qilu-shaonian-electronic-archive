name: YunZhan Cover Quarterly Sampling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_yunzhan_cover_quarterly.py'
      - '.github/workflows/yunzhan-cover-quarterly.yml'

permissions:
  contents: write

concurrency:
  group: yunzhan-cover-quarterly
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Sample quarterly snapshots
        run: python scripts/recover_yunzhan_cover_quarterly.py
      - name: Commit sampling metadata
        run: |
          if [ -z "$(git status --porcelain -- data/yunzhan_cover_quarterly)" ]; then exit 0; fi
          git config user.name 'qilu-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/yunzhan_cover_quarterly
          git commit -m 'data: sample YunZhan cover history quarterly'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
